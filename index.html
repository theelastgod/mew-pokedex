<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mew</title>
    <meta name="description" content="Mew. No. 151. The truck was empty." />
    <meta name="theme-color" content="#07060a" />
    <meta property="og:title" content="Mew" />
    <meta property="og:description" content="Mew. No. 151. The truck was empty." />
    <meta property="og:image" content="https://mewonsol.com/assets/og.jpg" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mewonsol.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@mew_on_sol" />
    <meta name="twitter:title" content="Mew" />
    <meta name="twitter:image" content="https://mewonsol.com/assets/og.jpg" />
    <link rel="icon" href="./assets/favicon-32.jpg" sizes="32x32" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.jpg" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="wash" id="wash"></div>
    <div class="app" id="app">
      <header>
        <a class="mark" href="#jungle" data-go="jungle" aria-label="Play the jungle clip">
          <img src="./assets/token-logo.jpg" alt="" width="36" height="36" />
        </a>
        <p class="name">
          <span id="title">Mew</span>
          <small id="kicker">Jungle</small>
        </p>
        <a class="xlink" href="https://x.com/mew_on_sol" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <path
              fill="currentColor"
              d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.727-8.835L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117z"
            />
          </svg>
          <span>@mew_on_sol</span>
        </a>
      </header>

      <div class="cluster">
      <div class="stage">
        <div class="frame" id="frame">
          <img class="poster" id="poster" alt="" src="./assets/jungle.jpg" />
          <video
            id="film"
            playsinline
            webkit-playsinline
            muted
            loop
            preload="auto"
            poster="./assets/jungle.jpg"
          ></video>
          <button class="play" id="play" type="button" aria-label="Play">
            <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
              <path fill="currentColor" d="M8 5.14v13.72L19 12 8 5.14z" />
            </svg>
          </button>
          <span class="sheen" id="sheen" hidden></span>
        </div>
      </div>

      <div class="transport">
        <button class="toggle" id="toggle" type="button" aria-label="Play or pause">
          <svg class="icon-play" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M8 5.14v13.72L19 12 8 5.14z" />
          </svg>
          <svg class="icon-pause" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z" />
          </svg>
        </button>
        <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Move through the clip" />
        <span id="time">0:00</span>
      </div>

      <nav class="reels" id="reels" aria-label="Clips"></nav>
      </div>

      <p class="ca" id="ca" hidden>
        <button type="button" id="ca-copy" data-copy=""></button>
      </p>
      <p class="fine">Fan work. Not affiliated with Nintendo, The Pokémon Company, or Game Freak.</p>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
